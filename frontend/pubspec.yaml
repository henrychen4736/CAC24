name: tennis_analyze
description: "Henry Tennis — film your swing, get specific coaching feedback."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.0
  dio: ^5.9.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "tennis_analyze"
  ios: true
  image_path: "Images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "Images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - Images/logo.png
    - assets/sample_report.json
