[project]
name = "tennis-ai"
version = "2.0.0"
description = "Tennis technique analysis service: pose estimation, stroke detection, biomechanics feedback"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "mediapipe>=0.10.14",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
train = ["torch>=2.4", "onnx>=1.16", "onnxscript>=0.1"]
auth = ["firebase-admin>=6.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
tennis-ai = "tennis_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
